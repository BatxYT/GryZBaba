<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Strona babki z grami</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .game-card {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: center;
        }
        iframe {
            width: 100%;
            height: 300px;
            border: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>Darmowe gry Babki</h1>

    <div class="games-grid">
        <div class="game-card">
            <h2>Minecamf</h2>
            <iframe src="https://classic.minecraft.net/" allowfullscreen="true" sandbox="allow-scripts allow-same-origin allow-pointer-lock"></iframe>
        </div>
    </div>

</body>
</html>
